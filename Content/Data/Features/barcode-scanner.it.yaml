faqTitle: "Domande frequenti"
faq:
  - question: "Lo scanner di codici a barre funziona su Android?"
    answer: "Sì. Su Android NFC.cool Tools legge 13 formati (EAN, UPC, Code 128, Code 39, Code 93, ITF, Codabar, QR, PDF417, Aztec e Data Matrix) con la modalità in serie e la scansione multipla. GS1 DataBar, Micro QR, Micro PDF417, i webhook alla scansione e la scelta del motore di ricerca per ora sono solo su iPhone."
  - question: "Posso leggere più codici a barre di seguito?"
    answer: "Sì. La modalità in serie tiene la fotocamera aperta e mette in coda ogni codice che trova. Tocca una voce della coda per agire su quel codice."
  - question: "Posso salvare e condividere le scansioni?"
    answer: "Sì. Ogni scansione resta nella cronologia con la sua data e ora. Da lì puoi metterla tra i preferiti, darle un titolo e condividerla."
  - question: "Lo scanner funziona senza connessione?"
    answer: "La lettura sì. La ricerca del prodotto ha bisogno di internet, perché passa il numero del codice a un motore di ricerca, ma il codice a barre viene letto solo sul dispositivo."

