faqTitle: "Sık sorulanlar"
faq:
  - question: "QR tarayıcı Android'de çalışır mı?"
    answer: "Evet. Android'deki NFC.cool Tools QR kodları ve barkodları tarar, geçmişte saklar; QR Kod Stüdyosu ve ana ekran için QR widget'ı da içinde. Bazı parçalar şimdilik yalnızca iPhone'da: fotoğraflardan ve ekran görüntülerinden kod okuma, Micro QR, Kısayollar, taramada webhook ve sesli sonuç, iCloud eşitleme."
  - question: "Stüdyo'da üretilen QR kodlar her okuyucuyla uyumlu mu?"
    answer: "Evet. Bunlar isteğe bağlı görsel dokunuşlar taşıyan standart QR kodlar. Her standart okuyucu (iOS Kamera, Google Lens, Android'in hazır tarayıcıları) bunları çözer."
  - question: "Ekran görüntüsünden QR kod tarayabilir miyim?"
    answer: "Evet, iPhone'da ve iPad'de. Galerinden herhangi bir görseli seç, NFC.cool içindeki her QR kodu bulsun. Kısmen kapalı olanları bile. Android'de kodlar kamerayla taranır."
  - question: "Stüdyo çıktılara filigran ya da NFC.cool logosu ekliyor mu?"
    answer: "Ücretsiz kodlarda küçük bir künye var. Platinum kodlarda filigran yok, tamamen senin tasarımın."

