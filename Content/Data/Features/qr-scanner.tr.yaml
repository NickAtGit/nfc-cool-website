capabilitiesTitle: "Neler yapabilirsin"
capabilities:
  - title: "Her QR kodu tara"
    description: "Bağlantılar, kişi kartları, Wi-Fi bilgileri, takvim etkinlikleri, telefon numaraları, e-posta, SMS ve konumlar: NFC.cool içerik türünü algılar ve doğru eylemi önerir. iPhone'da ödemeler ve uygulama mağazası bağlantıları da."
  - title: "Ekran görüntüsündeki QR kodu bul"
    description: "iPhone'da ve iPad'de galerinden herhangi bir görseli seç, NFC.cool içindeki QR kodları bulup çözsün. Kısmen kapalı ya da düşük kontrastlı olanları bile."
  - title: "QR Kod Stüdyosu"
    description: "Özel renkler, yuvarlatılmış köşe gözleri, kendi piksel biçimlerin ve ortada logo ya da emoji (iPhone'da Genmoji) ile QR kod tasarla. 4096×4096'ya kadar PNG olarak dışa aktar."
  - title: "Geçmiş ve yeniden paylaşım"
    description: "Her tarama cihazda saklanır: içeriği yeniden aç, kopyala, paylaş ya da doğrudan eyleme geri dön."
  - title: "Okuyunca otomatik çalışsın"
    description: "Kod tarandığı anda bağlantıyı aç ya da ses bağlantısını çal. iPhone'da tarama ayrıca kısayol çalıştırabilir, webhook tetikleyebilir ya da sonucu sesli okuyabilir. NFC taramalarını da besleyen aynı beş kancalı otomasyon."

subsectionsTitle: "Tarayıcıdan fazlası"
subsections:
  - title: "Widget'lar: QR kodun ana ekranda"
    body: "<p>En çok paylaştığın QR kodları <strong>QR Görsel Widget'ı</strong> ile iPhone ya da iPad ana ekranına koy. Ofisin Wi-Fi'si, kartvizit bağlantın, barının menüsü: bir bakışta görünür, sen hiçbir şey açmadan karşındakinin telefonuyla taranabilir. <strong>Son Tarama Widget'ı</strong> en son okuttuğun kodu gösterir, anında yeniden paylaşırsın. <strong>Tarama Düğmesi Widget'ı</strong> ise tarayıcıyı doğrudan ana ekrandan ya da kilit ekranından açar: tek dokunuş, iOS 17 ve sonrasında etkileşimli denetimlerle.</p>"
    imagePath: "/assets/images/Features/qr-scanner-widgets-home-screen.webp"
    imageAlt: "QR kod widget'ları ve tarama düğmesi bulunan iPhone ana ekranı"
    platforms: "iOS"

  - title: "Android'de: QR widget'ı, Hızlı Ayarlar kutucuğu ve kısayol"
    body: "<p>Android'de <strong>QR kod widget'ı</strong> kayıtlı bir kodu ana ekrana koyar: çerçeveli, yeniden boyutlandırılabilir, başlıklı ya da başlıksız. İstediğin kadar ekle, Platinum ile her biri farklı bir kod gösterebilir. Uygulamayı aramadan taramaya başlamak için <strong>Kod tara</strong> kutucuğunu Hızlı Ayarlar'a ekle ya da uygulama simgesine uzun bas ve aynı kısayolu seç.</p>"
    platforms: "Android"

  - title: "QR Kod Stüdyosu: piksel biçimleri, renkler, gözler, logolar"
    body: "<p>QR Kod Stüdyosu okunabilirliği korurken o kurumsal kare görüntüden kurtarır. Piksel biçimini seç (yuvarlak, nokta, baklava ve dahası), göz biçimlerini belirle, ön plan ve arka plan rengini seç, ortaya logo ya da emoji koy; iPhone'da her göze ayrı biçim ve Genmoji de var. Altı piksel boyutunda dışa aktar: 512, 1024, 1536, 2048, 3072 ve 4096.</p><p>Android'de Stüdyo kodun arkasına görsel de koyar (fotoğraf, emoji, sembol ya da metin) ve tasarımı sen çalışırken denetler: bir değişiklik kodu okunamaz hale getirecekse hemen söyler.</p>"
    imagePath: "/assets/images/Features/qr-scanner-studio-card.webp"
    imageAlt: "Özel logolu QR Kod Stüdyosu"
    platforms: "iOS · Android"

  - title: "Çoklu tarama, toplu okuma ve istediğinde fener"
    body: "<p>Üç ayar tarayıcıyı tek seferlik olmaktan çıkarıp sürekli bir akışa çevirir. <strong>Çoklu tarama</strong> tek kamera oturumunda birden çok kod okutmanı sağlar. <strong>Toplu okuma</strong> sayım ya da etkinlik girişleri için kamerayı açık tutar. <strong>Otomatik fener</strong> ise loş ışıkta LED'i yakar, el feneri düğmesini aramakla uğraşmazsın.</p>"
    imagePath: "/assets/images/Features/qr-scanner-multi-scan-batch-torch.webp"
    imageAlt: "Fener ışığıyla birden çok QR kod ve barkod tarayan iPhone"
    platforms: "iOS · Android"

  - title: "Kısayollar ve App Intents"
    body: "<p>NFC.cool, hazır eylemleriyle doğrudan iOS Kısayollar uygulamasına bağlanır: son okunan NFC tag'ini al, tag'e mesaj yaz, tarayıcıyı aç ya da son okunan QR kodu getir. Bunları zincirleyip tag okuyan, içeriğini çözen ve sonrasında ne istersen onu başlatan kısayollar kur: otomasyon, kayıt tutma, günlük, aklına ne gelirse. Aynı eylemler iOS 17 ve sonrasındaki kilit ekranı <strong>Tarama Düğmesi</strong> denetimini de besler.</p>"
    imagePath: "/assets/images/Features/nfc-reader-writer-shortcuts-app-intents.webp"
    imageAlt: "NFC tag'ini otomasyon bloklarına bağlayan iPhone"
    platforms: "iOS"

  - title: "iPhone, iPad ve Mac arasında iCloud eşitleme"
    body: "<p>Tarama geçmişin ve QR Stüdyosu tasarımların iCloud hesabındaki her cihaz arasında eşitlenir. QR kodu iPad'de tasarla, iPhone'dan paylaş, <a href=\"/blog/nfc-cool-comes-to-mac/\">Mac'te</a> düzenle: aynı kitaplık, aynı düzenlemeler, ileri geri dosya taşımak yok.</p>"
    imagePath: "/assets/images/Blog/nfc-cool-comes-to-mac.webp"
    imageAlt: "iPhone, iPad ve Mac arasında eşitlenen NFC.cool"
    platforms: "iOS"

