capabilitiesTitle: "Was du tun kannst"
capabilities:
  - title: "Alle gängigen Barcode-Formate"
    description: "EAN-13/8, UPC-A/E, Code 128, Code 39, Code 93, ITF, ITF-14, Codabar, PDF417, Aztec, Data Matrix und QR auf beiden Plattformen, dazu GS1 DataBar, Code 39 Mod 43, Micro QR und Micro PDF417 auf dem iPhone - automatische Formaterkennung, kein Modus-Wechsel."
  - title: "Batch-Modus"
    description: "Scanne eine Reihe von Barcodes hintereinander, ohne neu zu zielen. Praktisch für Inventur, Event-Check-ins oder Bibliotheks-Archivierung."
  - title: "Produktsuche"
    description: "Tippe einen gescannten Einzelhandels-Barcode an, um ihn nachzuschlagen - die Barcode-Nummer wird durch eine Suchmaschine geschickt, die passende Ergebnisse liefert. Auf dem iPhone wählst du die Suchmaschine: Google, Ecosia, DuckDuckGo, Bing oder Startpage."
  - title: "Scan-Verlauf & Teilen"
    description: "Jeder Scan wird mit Zeitstempel gespeichert. Markiere wichtige Scans als Favorit, gib einem Scan einen eigenen Titel und teile ihn direkt aus der Verlaufsansicht."
  - title: "Automatische Aktion beim Lesen"
    description: "Links öffnen sich beim Scannen automatisch, auf iPhone und Android. Auf dem iPhone kann ein Scan außerdem einen Shortcut ausführen, einen Webhook auslösen oder vorgelesen werden - dieselben fünf Hooks wie bei NFC und QR."

subsectionsTitle: "Für das Scannen großer Mengen"
subsections:
  - title: "Multi-Scan, Batch-Read und Taschenlampe bei Bedarf"
    body: "<p>Drei Einstellungen verwandeln den Scanner von Einmal-Scan in einen kontinuierlichen Workflow. <strong>Multi-Scan</strong> nimmt mehrere Codes in einer Kamera-Session auf. <strong>Batch-Read</strong> hält die Kamera offen für Inventur oder Event-Check-ins. <strong>Auto-Taschenlampe</strong> schaltet die LED bei schlechtem Licht ein.</p>"
    imagePath: "/assets/images/Features/qr-scanner-multi-scan-batch-torch.webp"
    imageAlt: "iPhone scannt mehrere QR-Codes und Barcodes mit Taschenlampenlicht"
    platforms: "iOS · Android"

  - title: "Webhooks für Bestandsführung & Event-Check-in"
    body: "<p>Richte den Barcode-Scanner auf dein Backend-System aus. Jeder gelesene Barcode löst einen Webhook an deine URL aus, sodass deine Inventur-Datenbank, dein Teilnehmer-CRM oder dein Bibliothekskatalog in Echtzeit aktualisiert wird, während die Kamera weiterläuft. Siehe <a href=\"/de/features/webhooks/\">Webhooks & Automatisierung</a> für JSON-Payload und Referenz-Server.</p>"
    platforms: "iOS"

  - title: "Shortcuts & App Intents"
    body: "<p>NFC.cool klinkt sich mit eingebauten Aktionen direkt in die iOS-Kurzbefehle-App ein: den zuletzt gescannten NFC-Tag abrufen, eine Nachricht auf einen Tag schreiben, den Scanner öffnen oder den zuletzt gescannten QR-Code holen. Verkette sie zu Shortcuts, die einen Tag scannen, die Payload parsen und dann tun, was immer du willst - Automatisierung, Logging, Journaling, alles. Dieselben Aktionen treiben den <strong>Scan-Button</strong> auf dem Lockscreen unter iOS 17+ an.</p>"
    imagePath: "/assets/images/Features/nfc-reader-writer-shortcuts-app-intents.webp"
    imageAlt: "iPhone verbindet NFC-Tag mit Automationsblöcken"
    platforms: "iOS"

  - title: "iCloud-Sync über iPhone, iPad und Mac"
    body: "<p>Dein Barcode-Scan-Verlauf synchronisiert über jedes Gerät an deiner iCloud. Scanne ein Regal voller Produkte auf dem iPhone, prüfe die Liste auf dem iPad, benenne und teile Scans vom <a href=\"/de/blog/nfc-cool-comes-to-mac/\">Mac</a> - ein synchroner Verlauf, nichts von Hand zu verschieben.</p>"
    imagePath: "/assets/images/Blog/nfc-cool-comes-to-mac.webp"
    imageAlt: "NFC.cool synchronisiert über iPhone, iPad und Mac"
    platforms: "iOS"

