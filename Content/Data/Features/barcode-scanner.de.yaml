faqTitle: "Häufig gefragt"
faq:
  - question: "Funktioniert der Barcode-Scanner auf Android?"
    answer: "Ja. NFC.cool Tools auf Android liest 13 Formate - EAN, UPC, Code 128, Code 39, Code 93, ITF, Codabar, QR, PDF417, Aztec und Data Matrix - mit Batch- und Multi-Scan-Modus. GS1 DataBar, Micro QR, Micro PDF417, Webhooks beim Scannen und die Wahl der Suchmaschine gibt es vorerst nur auf dem iPhone."
  - question: "Kann ich mehrere Barcodes auf einmal scannen?"
    answer: "Ja - im Batch-Modus bleibt die Kamera offen und reiht jeden gefundenen Barcode in eine Warteschlange. Tippe auf einen Eintrag, um damit zu arbeiten."
  - question: "Kann ich meine Scans speichern und teilen?"
    answer: "Ja - jeder Scan bleibt mit Zeitstempel in der Verlaufsansicht. Du kannst einen Scan als Favorit markieren, ihm einen Titel geben und ihn von dort teilen."
  - question: "Funktioniert der Scanner offline?"
    answer: "Das Scannen selbst ja. Die Produktsuche braucht Internet (sie schickt die Barcode-Nummer durch eine Web-Suchmaschine), aber das Lesen des Barcodes passiert nur auf dem Gerät."
