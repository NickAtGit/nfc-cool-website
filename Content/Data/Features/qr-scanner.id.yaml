faqTitle: "Pertanyaan yang sering diajukan"
faq:
  - question: "Apakah pemindai kode QR berfungsi di Android?"
    answer: "Ya. NFC.cool Tools di Android memindai kode QR dan barcode, menyimpannya di riwayat Anda, serta menyertakan QR Code Studio dan widget kode QR untuk layar utama. Beberapa bagian masih khusus iPhone untuk saat ini: membaca kode dari foto dan tangkapan layar, Micro QR, Shortcuts, webhook dan hasil yang diucapkan saat memindai, serta Sinkronisasi iCloud."
  - question: "Apakah kode QR dari Studio kompatibel dengan semua pembaca?"
    answer: "Ya. Mereka adalah kode QR standar dengan gaya kosmetik opsional. Setiap pembaca standar (kamera iOS, Google Lens, pemindai stok Android) dapat mendekodenya."
  - question: "Bisakah saya memindai kode QR dari tangkapan layar?"
    answer: "Ya, di iPhone dan iPad. Pilih gambar apa pun dari perpustakaan foto Anda dan NFC.cool menemukan setiap kode QR di dalamnya - bahkan yang sebagian tertutup. Di Android, kode dipindai dengan kamera."
  - question: "Apakah Studio menyematkan watermark atau merek NFC.cool?"
    answer: "Kode gratis membawa atribusi kecil. Kode Platinum bebas watermark - murni desain Anda."

