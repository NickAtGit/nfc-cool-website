faqTitle: "Perguntas Frequentes"
faq:
  - question: "O leitor de códigos QR funciona no Android?"
    answer: "Sim. O NFC.cool Tools no Android lê códigos QR e códigos de barras, guarda-os no seu histórico e inclui o Estúdio de Códigos QR e um widget QR para o ecrã principal. Algumas partes são, por agora, exclusivas do iPhone: ler códigos a partir de fotografias e capturas de ecrã, Micro QR, Atalhos, webhooks e resultados lidos em voz alta na leitura, e a Sincronização iCloud."
  - question: "Os códigos QR do Estúdio são compatíveis com todos os leitores?"
    answer: "Sim. São códigos QR padrão com estilo cosmético opcional. Todos os leitores padrão (Câmara do iOS, Google Lens, leitores nativos do Android) os conseguem descodificar."
  - question: "Posso ler um código QR a partir de uma captura de ecrã?"
    answer: "Sim, no iPhone e no iPad. Escolha qualquer imagem da sua biblioteca de fotografias e a NFC.cool encontra todos os códigos QR no seu interior - mesmo os parcialmente tapados. No Android, os códigos são lidos com a câmara."
  - question: "O Estúdio incorpora alguma marca de água ou identificação da NFC.cool?"
    answer: "Os códigos gratuitos trazem uma pequena atribuição. Os códigos Platinum não têm marca de água - são puramente o seu desenho."

