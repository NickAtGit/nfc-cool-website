  description: "Leia códigos QR com a câmara no iPhone e no Android - e depois desenhe os seus próprios com formas e cores personalizadas e um logótipo ou emoji no Estúdio de Códigos QR integrado."
  imagePath: "/assets/images/Webflow/qr-studio.webp"
  platforms: "iOS · Android"

