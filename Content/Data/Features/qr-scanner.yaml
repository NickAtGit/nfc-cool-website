faqTitle: "Frequently Asked"
faq:
  - question: "Does the QR scanner work on Android?"
    answer: "Yes. NFC.cool Tools on Android scans QR codes and barcodes, keeps them in your history, and includes the QR Code Studio and a home-screen QR widget. A few parts are iPhone-only for now: reading codes from photos and screenshots, Micro QR, Shortcuts, webhooks and spoken results on scan, and iCloud Sync."
  - question: "Are the QR codes from the Studio compatible with all readers?"
    answer: "Yes. They're standard QR codes with optional cosmetic styling. Every standard reader (iOS Camera, Google Lens, Android stock scanners) can decode them."
  - question: "Can I scan a QR code from a screenshot?"
    answer: "Yes, on iPhone and iPad. Pick any image from your photo library and NFC.cool finds every QR code inside - even partially covered ones. On Android, codes are scanned with the camera."
  - question: "Does the Studio embed a watermark or NFC.cool branding?"
    answer: "Free codes carry a small attribution. Platinum codes are watermark-free - purely your design."

