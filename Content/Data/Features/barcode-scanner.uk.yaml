faqTitle: "Часті питання"
faq:
  - question: "Чи працює сканер штрихкодів на Android?"
    answer: "Так. NFC.cool Tools на Android читає 13 форматів (EAN, UPC, Code 128, Code 39, Code 93, ITF, Codabar, QR, PDF417, Aztec і Data Matrix) і підтримує пакетний режим та мультисканування. Поки тільки на iPhone є GS1 DataBar, Micro QR, Micro PDF417, вебхуки після сканування й вибір пошукової системи."
  - question: "Чи можна відсканувати кілька штрихкодів підряд?"
    answer: "Так, пакетний режим тримає камеру відкритою й складає в чергу кожен знайдений штрихкод. Натисни на будь-який рядок черги, щоб щось із ним зробити."
  - question: "Чи можна зберігати сканування і ділитися ними?"
    answer: "Так, кожне сканування лишається в історії разом із часом. Познач його зірочкою, дай назву й поділися просто звідти."
  - question: "Чи працює сканер без інтернету?"
    answer: "Саме сканування працює. Інтернет потрібен лише для пошуку товару, бо номер коду йде в пошукову систему, а от читання штрихкода відбувається тільки на пристрої."

