card:
  title: "Сканер штрихкодів"
  description: "Скануй EAN, UPC, Code 128, QR, PDF417, Data Matrix та інші коди на iPhone і Android. Пакетний режим тримає камеру відкритою для перерахунку залишків і реєстрації гостей."
  imagePath: "/assets/images/Webflow/qr-barcode.webp"
  platforms: "iOS · Android"

hero:
  title: "Сканер штрихкодів"
  subtitle: "Скануй EAN, UPC, Code 128, Code 39, ITF, QR, PDF417, Aztec і Data Matrix на iPhone і Android, а на iPhone ще й GS1 DataBar та варіанти Micro (усього 19 форматів). Пакетний режим тримає камеру відкритою для перерахунку залишків і реєстрації гостей."
