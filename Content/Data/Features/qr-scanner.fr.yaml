faqTitle: "Questions fréquentes"
faq:
  - question: "Le scanner de QR codes fonctionne-t-il sur Android ?"
    answer: "Oui. NFC.cool Tools sur Android scanne les QR codes et les codes-barres, les conserve dans votre historique, et inclut le studio de QR codes ainsi qu'un widget de QR code pour l'écran d'accueil. Quelques fonctions restent réservées à l'iPhone pour l'instant : la lecture des codes dans les photos et les captures d'écran, Micro QR, les Raccourcis, les webhooks et la lecture à voix haute au moment du scan, ainsi que la synchronisation iCloud."
  - question: "Les QR codes créés dans le studio sont-ils compatibles avec tous les lecteurs ?"
    answer: "Oui. Ce sont des QR codes standard avec un habillage esthétique facultatif. Tous les lecteurs standard (appareil photo iOS, Google Lens, scanners Android d'origine) peuvent les décoder."
  - question: "Puis-je scanner un QR code depuis une capture d'écran ?"
    answer: "Oui, sur iPhone et iPad. Choisissez une image dans votre photothèque et NFC.cool y trouve tous les QR codes, même partiellement masqués. Sur Android, les codes se scannent avec l'appareil photo."
  - question: "Le studio ajoute-t-il un filigrane ou une mention NFC.cool ?"
    answer: "Les codes gratuits portent une petite attribution. Les codes Platinum sont sans filigrane - uniquement votre création."

