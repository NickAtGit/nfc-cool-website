faqTitle: "Preguntas frecuentes"
faq:
  - question: "¿El lector de códigos QR funciona en Android?"
    answer: "Sí. NFC.cool Tools en Android escanea códigos QR y códigos de barras, los guarda en tu historial e incluye el estudio de códigos QR y un widget QR para la pantalla de inicio. Algunas partes son, por ahora, exclusivas de iPhone: leer códigos de fotos y capturas de pantalla, Micro QR, Atajos, webhooks y resultados leídos en voz alta al escanear, y la sincronización con iCloud."
  - question: "¿Los códigos QR del estudio son compatibles con todos los lectores?"
    answer: "Sí. Son códigos QR estándar con un estilo cosmético opcional. Cualquier lector estándar (la cámara de iOS, Google Lens, los lectores nativos de Android) puede decodificarlos."
  - question: "¿Puedo escanear un código QR desde una captura de pantalla?"
    answer: "Sí, en iPhone y iPad. Elige cualquier imagen de tu fototeca y NFC.cool encuentra todos los códigos QR que haya dentro - incluso los parcialmente tapados. En Android, los códigos se escanean con la cámara."
  - question: "¿El estudio incrusta alguna marca de agua o identificación de NFC.cool?"
    answer: "Los códigos gratis llevan una pequeña atribución. Los códigos Platinum no tienen marca de agua - son puramente tu diseño."

