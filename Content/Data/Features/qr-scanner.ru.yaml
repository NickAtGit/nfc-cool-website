faqTitle: "Частые вопросы"
faq:
  - question: "Сканер QR-кодов работает на Android?"
    answer: "Да. NFC.cool Tools на Android сканирует QR-коды и штрихкоды, хранит их в истории, а ещё в нём есть студия QR-кодов и виджет с QR-кодом для главного экрана. Пока только на iPhone остаются чтение кодов с фото и скриншотов, Micro QR, быстрые команды, вебхуки и озвучка результата при сканировании, а также синхронизация с iCloud."
  - question: "Коды из студии читаются любыми сканерами?"
    answer: "Да. Это обычные QR-коды, оформление на них чисто косметическое. Любой стандартный сканер (камера iOS, Google Lens, штатные сканеры Android) их распознает."
  - question: "Можно ли считать QR-код со скриншота?"
    answer: "Да, на iPhone и iPad. Выбери любую картинку из галереи, и NFC.cool найдёт на ней все QR-коды, даже частично закрытые. На Android коды сканируешь камерой."
  - question: "Студия добавляет водяной знак или логотип NFC.cool?"
    answer: "На бесплатных кодах остаётся небольшая подпись. В Platinum коды идут без водяных знаков, только твой дизайн."

