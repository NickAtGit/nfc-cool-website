faqTitle: "Frequently Asked"
faq:
  - question: "Does the barcode scanner work on Android?"
    answer: "Yes. NFC.cool Tools on Android reads 13 formats - EAN, UPC, Code 128, Code 39, Code 93, ITF, Codabar, QR, PDF417, Aztec and Data Matrix - with batch and multi-scan modes. GS1 DataBar, Micro QR, Micro PDF417, webhooks on scan and the choice of search engine are iPhone-only for now."
  - question: "Can I scan multiple barcodes at once?"
    answer: "Yes - batch mode keeps the camera open and queues every barcode it finds. Tap any item in the queue to act on it."
  - question: "Can I save and share my scans?"
    answer: "Yes - every scan stays in the history view with its timestamp. You can favorite a scan, give it a title, and share it from there."
  - question: "Does the scanner work offline?"
    answer: "Yes for the scan itself. Product lookup needs internet (it runs the barcode number through a search engine), but the barcode read is on-device only."

