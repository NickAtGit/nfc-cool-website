      - "Codabar"
      - "Interleaved 2 of 5, ITF-14"
      - "GS1 DataBar - standard, Expanded, Limited (iOS)"
  - title: "2D / Stacked Codes"
    items:
      - "QR Code"
      - "Micro QR (iOS)"
      - "PDF417"
      - "Micro PDF417 (iOS)"
      - "Aztec"
      - "Data Matrix"

