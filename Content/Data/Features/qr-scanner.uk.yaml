capabilitiesTitle: "Що вміє застосунок"
capabilities:
  - title: "Сканування будь-яких QR-кодів"
    description: "Посилання, контакти, паролі Wi-Fi, події календаря, номери телефонів, пошта, SMS і місця на мапі: NFC.cool розпізнає тип вмісту й одразу пропонує потрібну дію. На iPhone ще й платежі та посилання в App Store."
  - title: "Пошук QR-кодів на знімках екрана"
    description: "На iPhone і iPad вибери будь-яке зображення з галереї, і NFC.cool знайде та розшифрує кожен QR-код усередині, навіть частково перекритий чи блідий."
  - title: "QR-студія"
    description: "Малюй QR-коди у своїх кольорах, з округлими кутовими маркерами, власною формою пікселів і логотипом чи емодзі посередині (на iPhone ще й Genmoji). Експорт у PNG аж до 4096×4096."
  - title: "Історія і повторний обмін"
    description: "Кожне сканування зберігається локально: відкрий вміст знову, скопіюй його, поділися ним або одразу зроби те, що він пропонує."
  - title: "Автодія після сканування"
    description: "Щойно код прочитано, відкриється посилання або відтвориться аудіо за посиланням. На iPhone сканування може ще й запустити Швидку команду, надіслати вебхук чи озвучити результат уголос. Та сама автоматика з п'яти автодій, що й на NFC."

subsectionsTitle: "Більше, ніж сканер"
subsections:
  - title: "Віджети: твій QR-код на головному екрані"
    body: "<p>Винеси найпотрібніші QR-коди на головний екран iPhone чи iPad віджетом <strong>QR-зображення</strong>. Wi-Fi для офісу, посилання на візитівку, меню твого бару: видно з першого погляду, і будь-хто відсканує їх зі свого телефона, а тобі не треба нічого відкривати. Віджет <strong>Останнє сканування</strong> показує найсвіжіший код, щоб миттєво поділитися ним ще раз. А віджет <strong>Кнопка сканування</strong> запускає сканер прямо з головного екрана або з екрана блокування, одним натисканням, ще й через інтерактивні елементи керування в iOS 17 і новіших.</p>"
    imagePath: "/assets/images/Features/qr-scanner-widgets-home-screen.webp"
    imageAlt: "Головний екран iPhone з віджетами QR-кодів і кнопкою сканування"
    platforms: "iOS"

  - title: "На Android: віджет QR, плитка у Швидких налаштуваннях і ярлик"
    body: "<p>На Android <strong>віджет QR-коду</strong> виносить збережений код на головний екран: у рамці, зі змінним розміром, з назвою або без. Став скільки завгодно віджетів, а з Platinum кожен може показувати інший код. Щоб почати сканування, не шукаючи застосунок, додай плитку <strong>Сканувати код</strong> до Швидких налаштувань або утримуй значок застосунку й вибери той самий ярлик.</p>"
    platforms: "Android"

  - title: "QR-студія: форма пікселів, кольори, кутові маркери, логотипи"
    body: "<p>QR-студія дає позбутися корпоративної квадратної естетики, а код при цьому й далі чудово сканується. Вибирай форму пікселів (округлі, крапки, ромби та інші), стиль кутових маркерів, колір знака й тла, зображення логотипа або емодзі посередині, а на iPhone ще й окремий стиль для кожного кутового маркера та Genmoji. Експорт іде в шести розмірах: 512, 1024, 1536, 2048, 3072 і 4096 пікселів.</p><p>На Android студія ще й підкладає під код картинку (фото, емодзі, символ або текст) і перевіряє дизайн просто під час роботи: щойно якась правка зробила б код нечитабельним, студія одразу про це скаже.</p>"
    imagePath: "/assets/images/Features/qr-scanner-studio-card.webp"
    imageAlt: "QR-студія з власним логотипом на коді"
    platforms: "iOS · Android"

  - title: "Мультисканування, пакетне читання і ліхтарик за потреби"
    body: "<p>Три налаштування перетворюють сканер з одноразового на безперервний. <strong>Мультисканування</strong> дає відсканувати кілька кодів за один сеанс камери. <strong>Пакетне читання</strong> тримає камеру відкритою для перерахунку залишків чи реєстрації гостей. <strong>Автоліхтарик</strong> вмикає світлодіод у темряві, щоб не шукати кнопку ліхтарика наосліп.</p>"
    imagePath: "/assets/images/Features/qr-scanner-multi-scan-batch-torch.webp"
    imageAlt: "iPhone сканує кілька QR-кодів і штрихкодів при світлі ліхтарика"
    platforms: "iOS · Android"

  - title: "Швидкі команди й App Intents"
    body: "<p>NFC.cool вбудовується просто у Швидкі команди iOS і приносить готові дії: взяти останню зчитану NFC-мітку, записати повідомлення на мітку, відкрити сканер або дістати останній відсканований QR-код. Збери з них команду, яка зчитує мітку, розбирає її вміст і запускає далі що завгодно: автоматизацію, журнал, щоденник. Ті самі дії живлять кнопку <strong>Сканувати</strong> на екрані блокування в iOS 17 і новіших.</p>"
    imagePath: "/assets/images/Features/nfc-reader-writer-shortcuts-app-intents.webp"
    imageAlt: "iPhone зв'язує NFC-мітку з блоками автоматизації"
    platforms: "iOS"

  - title: "Синхронізація через iCloud між iPhone, iPad і Mac"
    body: "<p>Історія сканувань і твої роботи з QR-студії розходяться на кожен пристрій з тим самим обліковим записом iCloud. Намалюй QR на iPad, поділися ним з iPhone, доредагуй на <a href=\"/blog/nfc-cool-comes-to-mac/\">Mac</a>: одна бібліотека, ті самі правки, жодного експорту туди й назад.</p>"
    imagePath: "/assets/images/Blog/nfc-cool-comes-to-mac.webp"
    imageAlt: "NFC.cool синхронізується між iPhone, iPad і Mac"
    platforms: "iOS"

