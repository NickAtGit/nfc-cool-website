card:
  title: "Сканер QR-кодів і QR-студія"
  description: "Скануй QR-коди камерою на iPhone і Android, а потім малюй власні з довільною формою, кольорами й логотипом чи емодзі у вбудованій QR-студії."
  imagePath: "/assets/images/Webflow/qr-studio.webp"
  platforms: "iOS · Android"

hero:
  title: "Сканер QR-кодів і QR-студія"
  subtitle: "Скануй будь-який QR-код камерою на iPhone і Android, а на iPhone ще й витягуй його зі знімка екрана. Малюй власні QR-коди з логотипами, емодзі та фірмовими кольорами у вбудованій QR-студії."
  platforms: "iOS · Android"
