faqTitle: "Часті питання"
faq:
  - question: "Чи працює сканер QR-кодів на Android?"
    answer: "Так. NFC.cool Tools на Android сканує QR-коди й штрихкоди, зберігає їх в історії, а ще має QR-студію й віджет QR-коду для головного екрана. Дещо поки є тільки на iPhone: читання кодів із фото й знімків екрана, Micro QR, Швидкі команди, вебхуки й озвучення результату після сканування, а також синхронізація через iCloud."
  - question: "Чи прочитають коди зі студії всі сканери?"
    answer: "Так. Це звичайні QR-коди, лише з косметичним оздобленням. Їх розшифрує будь-який стандартний сканер: камера iOS, Google Lens, штатні сканери Android."
  - question: "Чи можна відсканувати QR-код зі знімка екрана?"
    answer: "Так, на iPhone і iPad. Вибери будь-яке зображення з галереї, і NFC.cool знайде на ньому всі QR-коди, навіть частково перекриті. На Android коди скануєш камерою."
  - question: "Чи додає студія водяний знак або згадку про NFC.cool?"
    answer: "На безкоштовному тарифі код несе невеликий підпис. Коди Platinum ідуть без водяних знаків, тільки твій дизайн."

