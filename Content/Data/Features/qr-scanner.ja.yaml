faqTitle: "よくある質問"
faq:
  - question: "QRスキャナーはAndroidでも使えますか？"
    answer: "はい。Android版NFC.cool ToolsはQRコードとバーコードをスキャンして履歴に保存でき、QRコードスタジオとホーム画面用のQRウィジェットも備えています。一部の機能は現在iPhone限定です: 写真やスクリーンショットからのコード読み取り、Micro QR、ショートカット、スキャン時のWebhookと読み上げ、iCloud同期。"
  - question: "スタジオで作ったQRコードはすべてのリーダーで読めますか？"
    answer: "はい。標準のQRコードに任意の装飾スタイルを加えているだけです。標準のリーダー(iOSカメラ、Google Lens、Android標準スキャナー)で問題なくデコードできます。"
  - question: "スクリーンショットからQRコードをスキャンできますか？"
    answer: "はい、iPhoneとiPadで対応しています。ライブラリの任意の画像を選ぶと、NFC.coolが含まれるすべてのQRコードを検出します - 一部が隠れていても。Androidではカメラでスキャンします。"
  - question: "スタジオの生成コードに透かしやNFC.coolのブランディングは入りますか？"
    answer: "Freeで生成したコードには小さなクレジットが付きます。Platinumのコードは透かしなし - 純粋にあなたのデザインです。"
