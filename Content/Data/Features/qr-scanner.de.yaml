faqTitle: "Häufig gefragt"
faq:
  - question: "Funktioniert der QR-Scanner auf Android?"
    answer: "Ja. NFC.cool Tools auf Android scannt QR-Codes und Barcodes, speichert sie in deinem Verlauf und enthält das QR Code Studio sowie ein QR-Widget für den Homescreen. Einige Teile gibt es vorerst nur auf dem iPhone: Codes aus Fotos und Screenshots lesen, Micro QR, Shortcuts, Webhooks und vorgelesene Ergebnisse beim Scannen sowie iCloud-Sync."
  - question: "Sind die Studio-QR-Codes mit allen Readern kompatibel?"
    answer: "Ja. Es sind Standard-QR-Codes mit optionalem kosmetischem Styling. Jeder Standard-Reader (iOS-Kamera, Google Lens, Android-Standardscanner) kann sie dekodieren."
  - question: "Kann ich einen QR-Code aus einem Screenshot scannen?"
    answer: "Ja, auf iPhone und iPad. Wähle ein beliebiges Bild aus der Mediathek und NFC.cool findet jeden QR-Code darin - auch teilweise verdeckte. Auf Android werden Codes mit der Kamera gescannt."
  - question: "Hat das Studio ein Wasserzeichen oder NFC.cool-Branding?"
    answer: "Free-Codes tragen einen kleinen Hinweis. Platinum-Codes sind wasserzeichenfrei - rein dein Design."
