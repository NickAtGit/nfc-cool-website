  platforms: "iOS · Android"
  heroImagePath: "/assets/images/Webflow/qr-studio.webp"

capabilitiesTitle: "Was du tun kannst"
capabilities:
  - title: "Universelles QR-Scannen"
    description: "Links, Kontaktkarten, WLAN-Daten, Kalender-Events, Telefonnummern, E-Mail, SMS und Orte - NFC.cool erkennt den Payload-Typ und schlägt die richtige Aktion vor. Auf dem iPhone auch Zahlungs- und App-Store-Links."
  - title: "QR-Codes in Screenshots erkennen"
    description: "Wähle auf iPhone und iPad ein beliebiges Bild aus deiner Mediathek - NFC.cool findet und dekodiert jeden QR-Code darin, sogar teilweise verdeckte oder kontrastarme."
  - title: "QR Code Studio"
    description: "Gestalte QR-Codes mit eigenen Farben, abgerundeten Augenformen, eigenen Pixel-Formen sowie Logo oder Emoji in der Mitte (Genmoji auf dem iPhone). Export als PNG bis 4096×4096."
  - title: "Verlauf & Wiederfreigabe"
    description: "Jeder Scan wird lokal gespeichert - Payload erneut öffnen, kopieren, teilen oder direkt zur Aktion zurückspringen."
  - title: "Automatische Aktionen beim Lesen"
    description: "Einen Link öffnen oder einen Audio-Link abspielen - sobald ein Code gescannt wird. Auf dem iPhone kann ein Scan außerdem einen Shortcut ausführen, einen Webhook abfeuern oder das Ergebnis vorlesen. Dieselben fünf Hooks wie bei NFC."

subsectionsTitle: "Mehr als ein Scanner"
subsections:
  - title: "Widgets - dein QR auf dem Homescreen"
    body: "<p>Lege deine meistgeteilten QR-Codes als <strong>QR-Image-Widget</strong> auf den Homescreen von iPhone oder iPad. WLAN fürs Büro, der Link zu deiner Visitenkarte, die Speisekarte deiner Bar - auf einen Blick sichtbar und vom Handy daneben scannbar, ohne dass du etwas öffnen musst. Das <strong>Last-Scan-Widget</strong> zeigt den zuletzt gescannten Code, sodass du ihn sofort wieder teilen kannst. Und das <strong>Scan-Button-Widget</strong> öffnet den Scanner direkt vom Homescreen oder Lockscreen - ein Tap, unter iOS 17+ sogar über interaktive Controls.</p>"
    imagePath: "/assets/images/Features/qr-scanner-widgets-home-screen.webp"
    imageAlt: "iPhone-Homescreen mit QR-Code-Widgets und Scan-Button"
    platforms: "iOS"

  - title: "Auf Android: QR-Widget, Schnelleinstellungen-Kachel und Verknüpfung"
    body: "<p>Auf Android legt das <strong>QR-Code-Widget</strong> einen gespeicherten Code auf deinen Homescreen, gerahmt und in der Größe anpassbar, mit oder ohne Titel. Platziere so viele, wie du willst - mit Platinum kann jedes einen anderen Code zeigen. Um mit dem Scannen zu starten, ohne die App zu suchen, füge die Kachel <strong>Code scannen</strong> zu den Schnelleinstellungen hinzu, oder drücke lange auf das App-Icon und wähle dieselbe Verknüpfung.</p>"
    platforms: "Android"

  - title: "QR Code Studio: Pixel-Formen, Farben, Augen, Logos"
    body: "<p>Im QR Code Studio bleibt die Scanbarkeit erhalten, aber die corporate-eckige Ästhetik geht. Wähle Pixel-Formen (rund, Punkt, Raute und mehr), Augen-Stile, Vorder- und Hintergrundfarben, ein Logo oder Emoji in der Mitte - auf dem iPhone auch Stile pro Auge und Genmoji. Export in sechs Pixelgrößen - 512, 1024, 1536, 2048, 3072 oder 4096.</p><p>Auf Android legt das Studio außerdem ein Motiv hinter den Code (ein Foto, Emoji, Symbol oder Text) und prüft dein Design laufend: Sobald eine Änderung den Code unlesbar machen würde, sagt es dir Bescheid.</p>"
    imagePath: "/assets/images/Features/qr-scanner-studio-card.webp"
    imageAlt: "QR Code Studio mit eigenem Logo"
    platforms: "iOS · Android"

  - title: "Multi-Scan, Batch-Read und Taschenlampe bei Bedarf"
    body: "<p>Drei Einstellungen verwandeln den Scanner von Einmal-Scan in einen kontinuierlichen Workflow. <strong>Multi-Scan</strong> nimmt mehrere Codes in einer Kamera-Session auf. <strong>Batch-Read</strong> hält die Kamera offen für Inventur oder Event-Check-ins. <strong>Auto-Taschenlampe</strong> schaltet die LED bei schlechtem Licht ein.</p>"
    imagePath: "/assets/images/Features/qr-scanner-multi-scan-batch-torch.webp"
    imageAlt: "iPhone scannt mehrere QR-Codes und Barcodes mit Taschenlampenlicht"
    platforms: "iOS · Android"

  - title: "Shortcuts & App Intents"
    body: "<p>NFC.cool klinkt sich mit eingebauten Aktionen direkt in die iOS-Kurzbefehle-App ein: den zuletzt gescannten NFC-Tag abrufen, eine Nachricht auf einen Tag schreiben, den Scanner öffnen oder den zuletzt gescannten QR-Code holen. Verkette sie zu Shortcuts, die einen Tag scannen, die Payload parsen und dann tun, was immer du willst - Automatisierung, Logging, Journaling, alles. Dieselben Aktionen treiben den <strong>Scan-Button</strong> auf dem Lockscreen unter iOS 17+ an.</p>"
    imagePath: "/assets/images/Features/nfc-reader-writer-shortcuts-app-intents.webp"
    imageAlt: "iPhone verbindet NFC-Tag mit Automationsblöcken"
    platforms: "iOS"

  - title: "iCloud-Sync über iPhone, iPad und Mac"
    body: "<p>Scan-Verlauf und QR-Studio-Designs synchronisieren über jedes Gerät an deiner iCloud. Entwirf einen QR auf dem iPad, teile ihn vom iPhone, bearbeite ihn auf dem <a href=\"/de/blog/nfc-cool-comes-to-mac/\">Mac</a> - gleiche Bibliothek, gleiche Edits, kein Hin-und-her-Exportieren.</p>"
    imagePath: "/assets/images/Blog/nfc-cool-comes-to-mac.webp"
    imageAlt: "NFC.cool synchronisiert über iPhone, iPad und Mac"
    platforms: "iOS"

