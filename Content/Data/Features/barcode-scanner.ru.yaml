faqTitle: "Частые вопросы"
faq:
  - question: "Сканер штрихкодов работает на Android?"
    answer: "Да. NFC.cool Tools на Android читает 13 форматов (EAN, UPC, Code 128, Code 39, Code 93, ITF, Codabar, QR, PDF417, Aztec и Data Matrix) и поддерживает пакетный режим и мультискан. Пока только на iPhone есть GS1 DataBar, Micro QR, Micro PDF417, вебхуки при сканировании и выбор поисковика."
  - question: "Можно ли считать несколько штрихкодов сразу?"
    answer: "Да, пакетный режим держит камеру открытой и складывает в очередь всё, что находит. Нажми на любой элемент очереди, чтобы с ним поработать."
  - question: "Можно ли сохранять сканы и делиться ими?"
    answer: "Да, каждое сканирование остаётся в истории с отметкой времени. Скан можно добавить в избранное, дать ему название и отправить прямо оттуда."
  - question: "Сканер работает без интернета?"
    answer: "Само сканирование работает. Поиск товара требует интернета, потому что номер уходит в поисковик, а вот чтение штрихкода полностью происходит на устройстве."

