      - "GS1 DataBar - estándar, Expanded, Limited (iOS)"
  - title: "Códigos 2D / apilados"
    items:
      - "Código QR"
      - "Micro QR (iOS)"
      - "PDF417"
      - "Micro PDF417 (iOS)"
      - "Aztec"
      - "Data Matrix"

