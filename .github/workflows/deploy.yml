name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # Pinned: setup-swift@v2 cannot install Swift on ubuntu-latest (26.04) yet
    runs-on: ubuntu-24.04
    # 30 min headroom for the COLD run (no cache yet): a cold Swift compile plus
    # resizing every image can exceed 15 min, which previously cancelled the job
    # before it could save the caches below. Warm runs (cache hit) finish in a
    # few minutes; this ceiling is only there so the first run can populate them.
    timeout-minutes: 30
    outputs:
      indexnow_payload: ${{ steps.indexnow.outputs.payload }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure git for private dependencies
        run: git config --global url."https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/".insteadOf "https://github.com/"

      # Installs the toolchain straight from swift.org. swift-actions/setup-swift@v2
      # refreshes its signing keys from keyserver.ubuntu.com and fails the whole
      # deploy when that server is down (2026-11-11); here the keys come from
      # swift.org over HTTPS and the download is still signature-checked.
      - name: Setup Swift
        env:
          SWIFT_VERSION: "6.2.1"
        run: |
          base="swift-${SWIFT_VERSION}-RELEASE-ubuntu24.04"
          url="https://download.swift.org/swift-${SWIFT_VERSION}-release/ubuntu2404/swift-${SWIFT_VERSION}-RELEASE/${base}.tar.gz"
          curl -fsSL "$url" -o /tmp/swift.tar.gz
          curl -fsSL "$url.sig" -o /tmp/swift.tar.gz.sig
          curl -fsSL --compressed https://www.swift.org/keys/all-keys.asc | gpg --import -
          gpg --verify /tmp/swift.tar.gz.sig /tmp/swift.tar.gz
          sudo tar -xzf /tmp/swift.tar.gz -C /opt
          echo "/opt/${base}/usr/bin" >> "$GITHUB_PATH"
          "/opt/${base}/usr/bin/swift" --version

      # Cache the Swift build products (compiled objects + resolved deps) keyed on
      # Package.resolved + Sources. Exact key = no recompile; the restore-keys fall
      # back to the latest same-deps build so changed sources only need an
      # incremental compile. Occasionally Swift still does a full rebuild.
      - name: Cache Swift build
        uses: actions/cache@v4
        with:
          path: .build
          key: swift-build-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-${{ hashFiles('Sources/**') }}
          restore-keys: |
            swift-build-${{ runner.os }}-${{ hashFiles('Package.resolved') }}-
            swift-build-${{ runner.os }}-

      # ImageMagick from its own pinned AppImage on GitHub, not apt: on 2026-11-11
      # both GitHub's Azure Ubuntu mirror and archive.ubuntu.com stalled for the
      # runners (20 s timeout per package) and the job ran into its 30 min limit.
      # The AppImage is unpacked once and called through a `magick` launcher, which
      # is the first name SiteKit's ImageToolResolver and fix-portrait-variants.py
      # look for.
      - name: Install ImageMagick
        env:
          IM_VERSION: "7.1.2-35"
          # SHA-256 of that AppImage, as GitHub lists it for the release asset.
          # Bump both together.
          IM_SHA256: "f111044ed06b68cfb478df724c5a32d35145afa21073242f888d234a2f8cc002"
        run: |
          curl -fsSL "https://github.com/ImageMagick/ImageMagick/releases/download/${IM_VERSION}/ImageMagick-${IM_VERSION}-gcc-x86_64.AppImage" -o /tmp/magick.AppImage
          echo "${IM_SHA256}  /tmp/magick.AppImage" | sha256sum -c -
          chmod +x /tmp/magick.AppImage
          mkdir -p "$HOME/imagemagick"
          (cd "$HOME/imagemagick" && /tmp/magick.AppImage --appimage-extract >/dev/null)
          printf '#!/bin/sh\nexec %s/imagemagick/squashfs-root/AppRun "$@"\n' "$HOME" | sudo tee /usr/local/bin/magick >/dev/null
          sudo chmod +x /usr/local/bin/magick
          magick -version
          magick -list format | grep -iE "^ *WEBP"

      # Persist SiteKit's content-addressed image/icon cache across runs. Variants
      # live at .sitekit-cache/images/<sha8>-<w>w.webp (sha8 = source content hash),
      # so an unchanged image reuses its variant and only new/changed images get
      # re-run through ImageMagick. The key deliberately does NOT hash Theme/** -
      # CSS/JS edits cannot change a content-image variant, and including them made
      # nearly every commit a total cache miss. restore-keys then falls back to the
      # newest cache with the same prefix, so a changed image reuses every unchanged
      # sibling instead of rebuilding all of them.
      - name: Cache resized images
        uses: actions/cache@v4
        with:
          path: .sitekit-cache
          key: sitekit-cache-v2-${{ hashFiles('Content/Assets/**', 'Content/ImageManifest.yaml') }}
          restore-keys: |
            sitekit-cache-v2-

      # Translation completeness gate. Runs before the build (sharing the same
      # debug compile) and fails the job on any gap - a missing locale file, an
      # untranslated UI string, a leftover scaffold TODO marker, or an em/en
      # dash in structured data. No `||`, so its exit code is authoritative.
      - name: i18n completeness gate
        run: swift run Site i18n-check

      # Single authoritative build. The previous `|| swift run -c release`
      # fallback silently masked debug-build failures behind a second build.
      - name: Build site
        run: swift run Site build

      # SiteKit's resizer box-fits variants (-resize WxW>), so portrait images
      # come out narrower than their srcset descriptors claim and render soft.
      # Regenerate those width-only, in _Site and in the cached variants above,
      # so warm runs stay fixed. Drop once SiteKit resizes by width only.
      - name: Fix portrait image variants
        run: python3 Scripts/fix-portrait-variants.py

      # Compares the built pages with the fingerprints the live site published on
      # its last deploy, and adds the new fingerprints to _Site for the next one.
      # Its failure only costs one announcement, never the deploy.
      - name: Find the pages this deploy changes
        id: indexnow
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: python3 Scripts/indexnow.py

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_Site'

  deploy:
    # PRs run the gate + build for verification only; deploy is push/dispatch.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # After deploy-pages, so the announced pages and the key file are already live.
      # An answer other than 200/202 shows as a warning on the run; the deploy stays green.
      - name: Announce changed pages to IndexNow
        if: needs.build.outputs.indexnow_payload != ''
        continue-on-error: true
        env:
          PAYLOAD: ${{ needs.build.outputs.indexnow_payload }}
        run: |
          code=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d "$PAYLOAD" https://api.indexnow.org/indexnow) || code=failed
          echo "IndexNow answered: $code"
          case "$code" in 200|202) ;; *) echo "::warning::IndexNow answered $code, so this deploy's pages were not announced" ;; esac
